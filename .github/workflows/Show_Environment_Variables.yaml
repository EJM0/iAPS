name: Show Environment Variables

on:
  workflow_dispatch:

jobs:
  show-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Show environment variables (secrets)
        run: |
          echo "APP_IDENTIFIER: $APP_IDENTIFIER"
          echo "FASTLANE_ISSUER_ID: $FASTLANE_ISSUER_ID"
          echo "FASTLANE_KEY: $FASTLANE_KEY"
          echo "FASTLANE_KEY_ID: $FASTLANE_KEY_ID"
          echo "GH_PAT: $GH_PAT"
          echo "MATCH_PASSWORD: $MATCH_PASSWORD"
          echo "TEAMID: $TEAMID"
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAMID: ${{ secrets.TEAMID }}
